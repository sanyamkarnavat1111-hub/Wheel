/* ============================================================================
   ASTROWHEEL v2 — restyled to match the reference screenshots: a spare,
   typographic hero, small-caps monospace eyebrow labels, a gold/copper +
   deep-violet palette, and a sparse (not busy) starfield.

   Implementation notes:
   - Single-file artifact. In a real Vite project, split along the section
     headers below into src/components/{SpaceBackground,UserDetailsModal,
     FortuneWheel,ChatInterface}.jsx.
   - `framer-motion` / `canvas-confetti` aren't importable in this sandbox,
     and localStorage is disabled here — both are hand-rolled with CSS +
     a small canvas particle system, and state lives in React only for this
     session. Seams to swap in the real thing are marked "REAL APP:".
   - Submit-button hardening: the modal's CTA now has BOTH a form onSubmit
     and a button onClick fallback, validation no longer silently no-ops
     (it shakes the invalid field and shows inline copy), and the time+AM/PM
     pair always has a safe default so a half-filled form can't get stuck.
   ========================================================================= */

const SEGMENTS = [
  { value: 500, label: "500", color: "#c9946b", weight: 1 },
  { value: 0, label: "0", color: "#1c1a2e", weight: 22 },
  { value: 5, label: "5", color: "#221f38", weight: 24 },
  { value: 10, label: "10", color: "#1c1a2e", weight: 19 },
  { value: 20, label: "20", color: "#221f38", weight: 15 },
  { value: 50, label: "50", color: "#2a2542", weight: 10 },
  { value: 100, label: "100", color: "#332a4f", weight: 6 },
  { value: 200, label: "200", color: "#8b6f7a", weight: 3 },
];

const SEGMENT_ANGLE = 360 / SEGMENTS.length;

function pickWeightedSegment() {
  const total = SEGMENTS.reduce((s, seg) => s + seg.weight, 0);
  let r = Math.random() * total;
  for (let i = 0; i < SEGMENTS.length; i++) {
    r -= SEGMENTS[i].weight;
    if (r <= 0) return i;
  }
  return 0;
}

function polarToCartesian(cx, cy, r, angleDeg) {
  const a = ((angleDeg - 90) * Math.PI) / 180;
  return { x: cx + r * Math.cos(a), y: cy + r * Math.sin(a) };
}

function arcPath(cx, cy, r, startAngle, endAngle) {
  const start = polarToCartesian(cx, cy, r, endAngle);
  const end = polarToCartesian(cx, cy, r, startAngle);
  const largeArc = endAngle - startAngle <= 180 ? "0" : "1";
  return `M ${cx} ${cy} L ${start.x} ${start.y} A ${r} ${r} 0 ${largeArc} 0 ${end.x} ${end.y} Z`;
}

        {stars.map((s) => (
          <div

              top: `${s.top}%`,

              width: s.size,
              height: s.size,
              animation: `twinkle ${s.duration}s ease-in-out infinite`,
              animationDelay: `${s.delay}s`,

          <div key={s.id} className="absolute" style={{ top: `${s.top}%`, left: `${s.left}%`, animation: `shootingStar ${s.duration}s linear infinite`, animationDelay: `${s.delay}s` }}>

  );
}

/* ---------------------------------------------------------------------------
   Confetti — canvas particle burst (stand-in for canvas-confetti)
--------------------------------------------------------------------------- */
function useConfetti() {
  const canvasRef = useRef(null);
  useEffect(() => {
    const canvas = document.createElement("canvas");
    Object.assign(canvas.style, { position: "fixed", inset: "0", width: "100vw", height: "100vh", pointerEvents: "none", zIndex: "9999" });
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
    document.body.appendChild(canvas);
    canvasRef.current = canvas;
    const onResize = () => { canvas.width = window.innerWidth; canvas.height = window.innerHeight; };
    window.addEventListener("resize", onResize);
    return () => { window.removeEventListener("resize", onResize); canvas.remove(); };
  }, []);

  return useCallback((originX, originY) => {
    const canvas = canvasRef.current;
    if (!canvas) return;
    const ctx = canvas.getContext("2d");
    const colors = [TOKENS.violet, TOKENS.gold, TOKENS.copper, "#ffffff"];
    const particles = Array.from({ length: 90 }, () => {
      const angle = Math.random() * Math.PI * 2;
      const speed = 4 + Math.random() * 9;
      return { x: originX, y: originY, vx: Math.cos(angle) * speed, vy: Math.sin(angle) * speed - 3, g: 0.22, size: 3 + Math.random() * 4, color: colors[Math.floor(Math.random() * colors.length)], life: 60 + Math.random() * 30, rot: Math.random() * 360, spin: (Math.random() - 0.5) * 20 };
    });
    function tick() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      let alive = false;
      particles.forEach((p) => {
        if (p.life <= 0) return;
        alive = true;
        p.vy += p.g; p.x += p.vx; p.y += p.vy; p.rot += p.spin; p.life -= 1;
        ctx.save(); ctx.translate(p.x, p.y); ctx.rotate((p.rot * Math.PI) / 180);
        ctx.globalAlpha = Math.max(p.life / 90, 0); ctx.fillStyle = p.color;
        ctx.fillRect(-p.size / 2, -p.size / 2, p.size, p.size * 0.6);
        ctx.restore();
      });
      if (alive) requestAnimationFrame(tick); else ctx.clearRect(0, 0, canvas.width, canvas.height);
    }
    tick();
  }, []);
}

/* ---------------------------------------------------------------------------

--------------------------------------------------------------------------- */
function FortuneWheel({ onWin, spinsUsed }) {
  const { t } = React.useContext(LanguageContext);
  const [rotation, setRotation] = useState(0);
  const [spinning, setSpinning] = useState(false);
  const [lastWin, setLastWin] = useState(null);
  const wheelBtnRef = useRef(null);
  const confettiBurst = useConfetti();

  const size = 440;
  const cx = size / 2;
  const cy = size / 2;
  const r = size / 2 - 10;

  const handleSpin = () => {
    if (spinning) return;
    setSpinning(true);
    setLastWin(null);

    const winnerIndex = pickWeightedSegment();
    const segCenter = winnerIndex * SEGMENT_ANGLE + SEGMENT_ANGLE / 2;
    const fullSpins = 6 + Math.floor(Math.random() * 3);
    const currentMod = ((rotation % 360) + 360) % 360;
    const targetMod = (360 - segCenter) % 360;
    let delta = targetMod - currentMod;
    if (delta < 0) delta += 360;
    const nextRotation = rotation + fullSpins * 360 + delta;
    setRotation(nextRotation);

    window.setTimeout(() => {
      setSpinning(false);
      const won = SEGMENTS[winnerIndex].value;
      setLastWin(won);
      if (won > 0 && wheelBtnRef.current) {
        const rect = wheelBtnRef.current.getBoundingClientRect();
        confettiBurst(rect.left + rect.width / 2, rect.top + rect.height / 2);
      }
      onWin(won);
    }, 8600);
  };

  return (
    <div className="card card-blur rounded-3xl p-6 sm:p-8 flex flex-col items-center anim-fade-up" style={{ animationDelay: ".1s" }}>
      <div className="self-start mb-8 font-mono text-[11px] uppercase tracking-[0.2em]" style={{ color: TOKENS.mist }}>
        {t.wheelTitle} <span style={{ color: TOKENS.gold }}>· {t.wheelOrbits}</span>
      </div>

      <div className="relative flex justify-center items-center" style={{ width: 'min(100%, 45vh, 440px)', height: 'min(100%, 45vh, 440px)', margin: '0 auto' }}>
        <div className="absolute left-1/2 -translate-x-1/2 z-20" style={{ top: "-3%" }}>
          <div style={{ width: 0, height: 0, borderLeft: "clamp(6px, 1.5vw, 10px) solid transparent", borderRight: "clamp(6px, 1.5vw, 10px) solid transparent", borderTop: `clamp(12px, 3vw, 18px) solid ${TOKENS.gold}` }} />
        </div>

        <div className="absolute inset-0 rounded-full" style={{ background: "radial-gradient(circle, rgba(139,123,255,0.2) 0%, transparent 70%)", animation: spinning ? "softPulse 0.8s infinite alternate" : "softPulse 4s infinite alternate", transform: "scale(1.2)", zIndex: -1 }}></div>
        
        <div className="absolute inset-3 rounded-full" style={{ boxShadow: "0 0 40px rgba(232,184,102,0.15)", zIndex: 0 }}></div>
        
        <div className={`w-full h-full z-10 ${spinning ? "" : "anim-idle-spin"}`}>
          <svg width="100%" height="100%" viewBox={`0 0 ${size} ${size}`} className="wheel-transition" style={{ transform: `rotate(${rotation}deg)` }}>
          <defs>
            <radialGradient id="segmentShadow" cx="50%" cy="50%" r="50%">
              <stop offset="50%" stopColor="#ffffff" stopOpacity="0" />
              <stop offset="100%" stopColor="#000000" stopOpacity="0.45" />
              
            </radialGradient>
            <radialGradient id="ringGlow" cx="50%" cy="50%" r="50%">
              <stop offset="85%" stopColor={TOKENS.goldSoft} />
              <stop offset="100%" stopColor={TOKENS.copper} />
              
            </radialGradient>
          </defs>
          <circle cx={cx} cy={cy} r={r + 6} fill="none" stroke="url(#ringGlow)" strokeWidth="4" opacity="0.95" />
          <circle cx={cx} cy={cy} r={r + 2} fill="#0b0a12" stroke="rgba(255,255,255,0.08)" strokeWidth="1" />
          {SEGMENTS.map((seg, i) => {
            const start = i * SEGMENT_ANGLE;
            const end = start + SEGMENT_ANGLE;
            const mid = start + SEGMENT_ANGLE / 2;
            const labelPos = polarToCartesian(cx, cy, r * 0.62, mid);
            const pathD = arcPath(cx, cy, r, start, end);
            return (
              <g key={i}>
                <path d={pathD} fill={seg.color} stroke="rgba(0,0,0,0.4)" strokeWidth="1" />
                <path d={pathD} fill="url(#segmentShadow)" pointerEvents="none" />
                <text
                  x={labelPos.x}
                  y={labelPos.y}
                  textAnchor="middle"
                  dominantBaseline="middle"
                  fontFamily="Space Grotesk"
                  fontWeight="600"
                  fontSize={seg.value >= 200 ? 17 : 15}
                  fill={seg.value >= 200 ? "#1c1420" : "#f0eef7"}
                >
                  {seg.label}
                </text>
              </g>
            );
          })}
          <circle cx={cx} cy={cy} r={r * 0.24} fill="#0b0a12" stroke={TOKENS.gold} strokeWidth="2" />
          </svg>
        </div>

        <button
          ref={wheelBtnRef}
          onClick={handleSpin}
          disabled={spinning}
          className="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 rounded-full font-display font-bold text-xs tracking-widest flex items-center justify-center transition-transform active:scale-95 disabled:cursor-not-allowed z-10"
          style={{
            width: size * 0.2,
            height: size * 0.2,
            background: "#0b0a12",
            border: `2px solid ${TOKENS.gold}`,
            color: TOKENS.gold,
            boxShadow: spinning ? "0 0 16px rgba(232,184,102,0.4)" : "0 0 22px rgba(232,184,102,0.55)",
          }}
        >

              )}

          </div>
        )}
      </div>
    </div>
  );
}

          </p>
          <h3 className="font-display text-xl font-semibold mb-2">{t.chatLocked}</h3>
          <p className="text-sm max-w-[260px] leading-relaxed" style={{ color: TOKENS.mist }}>
            Gather the remaining Cosmic Energy to unlock your one-time private reading.
          </p>
        </div>
      )}
    </div>
  );
}

/* ---------------------------------------------------------------------------
   App
--------------------------------------------------------------------------- */
function App() {
  const [lang, setLang] = useState("en");
  const t = TRANSLATIONS[lang];
  const [userDetails, setUserDetails] = useState(null);
  const [points, setPoints] = useState(0);
  const [target, setTarget] = useState(500);
  const [spinsUsed, setSpinsUsed] = useState(0);
  const [unlocked, setUnlocked] = useState(false);

  const handleWin = (won) => {
    setSpinsUsed((s) => s + 1);
    const nextPoints = points + won;
    setPoints(nextPoints);
    if (nextPoints >= target && !unlocked) {
      setUnlocked(true);
      setTarget((t) => t + 500); // next milestone: 500 -> 1000 -> 1500 ...
    }
  };

  return (
    <LanguageContext.Provider value={{ lang, setLang, t }}>
      <div className="astrowheel-root min-h-screen w-full">
      <GlobalStyles />
      <SpaceBackground />

      {!userDetails && <UserDetailsModal onSubmit={setUserDetails} />}

      <div className={userDetails ? "" : "pointer-events-none blur-sm select-none"}>
        <Header points={points} target={target} />
        <Hero />

        <main className="max-w-6xl mx-auto px-5 sm:px-8 pb-16">
          <div className="grid grid-cols-1 lg:grid-cols-2 gap-5 sm:gap-8 items-start">
            <FortuneWheel onWin={handleWin} spinsUsed={spinsUsed} />
            <ChatInterface unlocked={unlocked} target={target} userDetails={userDetails} />
          </div>
        </main>
      </div>
    </div>
    </LanguageContext.Provider>
  );
}

const root = createRoot(document.getElementById("root"));
root.render(<App />);
  </script>
</body>
</html>
