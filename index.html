const LanguageContext = React.createContext();

const SEGMENTS = [
  { value: 500, label: "500", color: "#c9946b", weight: 1 },
  { value: 0, label: "0", color: "#1c1a2e", weight: 8 },
  { value: 5, label: "5", color: "#221f38", weight: 12 },
  { value: 10, label: "10", color: "#1c1a2e", weight: 30 },
  { value: 20, label: "20", color: "#221f38", weight: 30 },
  { value: 50, label: "50", color: "#2a2542", weight: 30 },
  { value: 100, label: "100", color: "#332a4f", weight: 6 },
  { value: 200, label: "200", color: "#8b6f7a", weight: 3 },
];

const SEGMENT_ANGLE = 360 / SEGMENTS.length;

function pickWeightedSegment() {
  const total = SEGMENTS.reduce((s, seg) => s + seg.weight, 0);
  let r = Math.random() * total;
  for (let i = 0; i < SEGMENTS.length; i++) {
    r -= SEGMENTS[i].weight;
    if (r <= 0) return i;
  }
  return 0;
}

function polarToCartesian(cx, cy, r, angleDeg) {
  const a = ((angleDeg - 90) * Math.PI) / 180;
  return { x: cx + r * Math.cos(a), y: cy + r * Math.sin(a) };
}

function arcPath(cx, cy, r, startAngle, endAngle) {
  const start = polarToCartesian(cx, cy, r, endAngle);
  const end = polarToCartesian(cx, cy, r, startAngle);
  const largeArc = endAngle - startAngle <= 180 ? "0" : "1";
  return `M ${cx} ${cy} L ${start.x} ${start.y} A ${r} ${r} 0 ${largeArc} 0 ${end.x} ${end.y} Z`;
}

/* ---------------------------------------------------------------------------
   Confetti — same canvas system, slightly richer particles
--------------------------------------------------------------------------- */
function useConfetti() {
  const canvasRef = useRef(null);
  useEffect(() => {
    const canvas = document.createElement("canvas");
    Object.assign(canvas.style, {
      position: "fixed",
      inset: "0",
      width: "100vw",
      height: "100vh",
      pointerEvents: "none",
      zIndex: "9999",
    });
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
    document.body.appendChild(canvas);
    canvasRef.current = canvas;
    const onResize = () => {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    };
    window.addEventListener("resize", onResize);
    return () => {
      window.removeEventListener("resize", onResize);
      canvas.remove();
    };
  }, []);

  return useCallback((originX, originY) => {
    const canvas = canvasRef.current;
    if (!canvas) return;
    const ctx = canvas.getContext("2d");
    const colors = [TOKENS.violet, TOKENS.gold, TOKENS.copper, "#ffffff", TOKENS.goldSoft];
    const particles = Array.from({ length: 110 }, () => {
      const angle = Math.random() * Math.PI * 2;
      const speed = 3.5 + Math.random() * 10;
      return {
        x: originX,
        y: originY,
        vx: Math.cos(angle) * speed,
        vy: Math.sin(angle) * speed - 4,
        g: 0.24,
        size: 2.5 + Math.random() * 4.5,
        color: colors[Math.floor(Math.random() * colors.length)],
        life: 55 + Math.random() * 35,
        rot: Math.random() * 360,
        spin: (Math.random() - 0.5) * 22,
      };
    });
    function tick() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      let alive = false;
      particles.forEach((p) => {
        if (p.life <= 0) return;
        alive = true;
        p.vy += p.g;
        p.x += p.vx;
        p.y += p.vy;
        p.rot += p.spin;
        p.life -= 1;
        ctx.save();
        ctx.translate(p.x, p.y);
        ctx.rotate((p.rot * Math.PI) / 180);
        ctx.globalAlpha = Math.max(p.life / 90, 0);
        ctx.fillStyle = p.color;
        ctx.fillRect(-p.size / 2, -p.size / 2, p.size, p.size * 0.55);
        ctx.restore();
      });
      if (alive) requestAnimationFrame(tick);
      else ctx.clearRect(0, 0, canvas.width, canvas.height);
    }
    tick();
  }, []);
}

function UserDetailsModal({ onSubmit }) {
  const { lang, setLang, t } = React.useContext(LanguageContext);
  const [name, setName] = useState("");
  const [dob, setDob] = useState("");
  const [place, setPlace] = useState("");
  const [time, setTime] = useState("");
  const [errors, setErrors] = useState({});
  const [shakeKey, setShakeKey] = useState(0);
  const [submitting, setSubmitting] = useState(false);

  const now = new Date();
  const todayStr = `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, "0")}-${String(now.getDate()).padStart(2, "0")}`;
  const minDateStr = `${now.getFullYear() - 100}-${String(now.getMonth() + 1).padStart(2, "0")}-${String(now.getDate()).padStart(2, "0")}`;

  const validate = () => {
    const next = {};
    if (!name.trim()) next.name = true;
    if (!dob.trim()) {
      next.dob = true;
    } else {
      const selected = new Date(dob);
      const minD = new Date(minDateStr);
      const maxD = new Date(todayStr);
      if (selected < minD || selected > maxD) next.dob = true;
    }
    if (!place.trim()) next.place = true;
    if (!time.trim()) next.time = true;
    return next;
  };

  const attemptSubmit = () => {
    if (submitting) return;
    const next = validate();
    setErrors(next);
    if (Object.keys(next).length > 0) {
      setShakeKey((k) => k + 1);
      return;
    }
    setSubmitting(true);
    window.setTimeout(() => {
      onSubmit({ name: name.trim(), dob: dob.trim(), place: place.trim(), time });
    }, 420);
  };

  const handleFormSubmit = (e) => {
    e.preventDefault();
    attemptSubmit();
  };

  return (
    <div className="fixed inset-0 z-50 flex items-center justify-center p-4 sm:p-6 anim-fade-in">
      <div
        className="absolute inset-0"
        style={{ background: "rgba(4,4,7,0.86)", backdropFilter: "blur(10px)" }}

        className={`glow-border relative w-full max-w-[420px] anim-glass-reveal ${shakeKey ? "anim-shake" : ""}`}
        style={{ boxShadow: "0 32px 90px rgba(0,0,0,0.7), 0 0 80px rgba(139,123,255,0.08)" }}
      >
        <div
          className="relative rounded-[28px] overflow-hidden p-7 sm:p-9"

            background: `linear-gradient(165deg, ${TOKENS.card} 0%, #0a0a12 60%, #0c0a14 100%)`,

                className="flex items-center gap-1.5 font-mono text-[9px] sm:text-[10px] uppercase tracking-[0.16em]"
                style={{ color: TOKENS.mist }}
              >
                <Zap className="w-3 h-3" style={{ color: TOKENS.gold }} />
                {t.energy}
              </div>
              <div className={`font-mono text-xs ${bump ? "anim-score-bump" : ""}`}>
                <span className="text-gold font-semibold">{points}</span>
                <span style={{ color: TOKENS.mist }}> / {target}</span>
              </div>
            </div>
            <div className="h-[4px] rounded-full bg-white/10 mt-2 overflow-hidden relative">
              <div
                className="h-full rounded-full transition-all duration-700 ease-out relative overflow-hidden"
                style={{
                  width: `${pct}%`,
                  background: `linear-gradient(90deg, ${TOKENS.copper}, ${TOKENS.gold}, ${TOKENS.goldSoft})`,
                  boxShadow: pct > 0 ? "0 0 10px rgba(232,184,102,0.4)" : "none",
                }}
              >
                <div
                  className="absolute inset-0"
                  style={{
                    background: "linear-gradient(90deg, transparent, rgba(255,255,255,0.35), transparent)",
                    backgroundSize: "200% 100%",
                    animation: "progressShine 2.5s linear infinite",
                  }}
                />
              </div>
            </div>
          </div>
        </div>
      </div>
    </header>
  );
}

/* ---------------------------------------------------------------------------
   FortuneWheel — primary visual focus
--------------------------------------------------------------------------- */
function FortuneWheel({ onWin, spinsUsed }) {
  const { t } = React.useContext(LanguageContext);
  const [rotation, setRotation] = useState(0);
  const [spinning, setSpinning] = useState(false);
  const [lastWin, setLastWin] = useState(null);
  const [pressAnim, setPressAnim] = useState(false);
  const wheelBtnRef = useRef(null);
  const confettiBurst = useConfetti();

  const size = 440;
  const cx = size / 2;
  const cy = size / 2;
  const r = size / 2 - 10;

  const handleSpin = () => {
    if (spinning) return;
    setPressAnim(true);
    window.setTimeout(() => setPressAnim(false), 280);
    setSpinning(true);
    setLastWin(null);

    const winnerIndex = pickWeightedSegment();
    const segCenter = winnerIndex * SEGMENT_ANGLE + SEGMENT_ANGLE / 2;
    const fullSpins = 6 + Math.floor(Math.random() * 3);
    const currentMod = ((rotation % 360) + 360) % 360;
    const targetMod = (360 - segCenter) % 360;
    let delta = targetMod - currentMod;
    if (delta < 0) delta += 360;
    const nextRotation = rotation + fullSpins * 360 + delta;
    setRotation(nextRotation);

    window.setTimeout(() => {
      setSpinning(false);
      const won = SEGMENTS[winnerIndex].value;
      setLastWin(won);
      if (won > 0 && wheelBtnRef.current) {
        const rect = wheelBtnRef.current.getBoundingClientRect();
        confettiBurst(rect.left + rect.width / 2, rect.top + rect.height / 2);
      }
      onWin(won);
    }, 8600);
  };

  return (
    <div
      className={`card-wheel card-blur rounded-3xl p-5 sm:p-7 lg:p-8 flex flex-col items-center anim-fade-up ${
        lastWin !== null && lastWin > 0 ? "anim-win-flash" : ""
      }`}
      style={{ animationDelay: ".08s" }}
    >
      {/* Title row */}
      <div className="self-start w-full mb-4 sm:mb-6 flex items-center justify-between gap-3">
        <div className="flex items-center gap-2.5">
          <div
            className="w-8 h-8 rounded-lg flex items-center justify-center"
            style={{
              background: "rgba(232,184,102,0.1)",
              border: "1px solid rgba(232,184,102,0.25)",
            }}
          >
            <Star className="w-3.5 h-3.5" style={{ color: TOKENS.gold }} />
          </div>
          <div>
            <div
              className="font-mono text-sm sm:text-base uppercase tracking-[0.14em] font-bold"
              style={{ color: "#c8c6d4" }}
            >
              {t.wheelTitle}
            </div>
            <div
              className="font-mono text-[10px] uppercase tracking-[0.2em] mt-0.5"
              style={{ color: TOKENS.gold }}
            >
              {t.wheelOrbits}
            </div>
          </div>
        </div>
        {!spinning && lastWin === null && (
          <span
            className="hidden sm:inline-flex items-center gap-1.5 font-mono text-[10px] uppercase tracking-widest anim-spin-hint"
            style={{ color: TOKENS.mist }}
          >
            <Sparkles className="w-3 h-3" style={{ color: TOKENS.gold }} />
            {t.spinBtn}
          </span>
        )}
      </div>

      {/* Wheel stage */}
      <div
        className="relative flex justify-center items-center mx-auto"
        style={{
          width: "min(100%, 44vh, 420px)",
          height: "min(100%, 44vh, 420px)",
          maxWidth: "100%",
        }}
      >
        {/* Floating energy orbs (decorative, always visible) */}
        <div
          className="absolute -left-2 top-1/4 w-2.5 h-2.5 rounded-full anim-float-orb pointer-events-none"
          style={{
            background: TOKENS.violet,
            boxShadow: `0 0 14px ${TOKENS.violet}`,
            animationDelay: "0s",
          }}
        />
        <div
          className="absolute -right-1 top-1/3 w-2 h-2 rounded-full anim-float-orb pointer-events-none"
          style={{
            background: TOKENS.gold,
            boxShadow: `0 0 12px ${TOKENS.gold}`,
            animationDelay: "1.2s",
          }}
        />
        <div
          className="absolute left-1/4 -bottom-1 w-1.5 h-1.5 rounded-full anim-float-orb pointer-events-none"
          style={{
            background: TOKENS.copper,
            boxShadow: `0 0 10px ${TOKENS.copper}`,
            animationDelay: "2.1s",
          }}
        />

        {/* Pointer */}
        <div
          className="absolute left-1/2 z-30"
          style={{
            top: "-3%",
            transform: "translateX(-50%)",
            animation: spinning ? "pointerBounce 0.32s ease-in-out infinite" : "none",
          }}
        >
          <div
            style={{
              width: 0,
              height: 0,
              borderLeft: "clamp(8px, 1.8vw, 12px) solid transparent",
              borderRight: "clamp(8px, 1.8vw, 12px) solid transparent",
              borderTop: `clamp(14px, 3.4vw, 22px) solid ${TOKENS.gold}`,
              filter: "drop-shadow(0 3px 8px rgba(232,184,102,0.65))",
            }}
          />
          <div
            className="absolute left-1/2 -translate-x-1/2"
            style={{
              top: 2,
              width: 6,
              height: 6,
              borderRadius: "50%",
              background: TOKENS.goldSoft,
              boxShadow: "0 0 8px rgba(232,184,102,0.8)",
            }}
          />
        </div>

        {/* Outer breathing ring */}
        <div
          className="absolute inset-0 rounded-full pointer-events-none anim-ring-breath"
          style={{
            border: "1.5px solid rgba(232,184,102,0.35)",
            boxShadow: spinning
              ? "0 0 60px rgba(232,184,102,0.35), 0 0 100px rgba(139,123,255,0.15)"
              : "0 0 40px rgba(232,184,102,0.18)",
            zIndex: 0,
          }}
        />

        {/* Ambient violet glow */}
        <div
          className="absolute inset-0 rounded-full pointer-events-none"
          style={{
            background: spinning
              ? "radial-gradient(circle, rgba(139,123,255,0.35) 0%, transparent 65%)"
              : "radial-gradient(circle, rgba(139,123,255,0.2) 0%, transparent 65%)",
            transform: "scale(1.2)",
            transition: "background 0.5s ease",
            zIndex: 0,
          }}
        />

        {/* Decorative outer ticks — SVG so they scale cleanly */}
        <svg
          className="absolute inset-0 w-full h-full pointer-events-none z-[5]"
          viewBox="0 0 100 100"
          aria-hidden="true"
        >
          {Array.from({ length: 32 }).map((_, i) => {
            const a = (i * 11.25 - 90) * (Math.PI / 180);
            const major = i % 4 === 0;
            const r1 = major ? 47.5 : 48.2;
            const r2 = 49.5;
            const x1 = 50 + r1 * Math.cos(a);
            const y1 = 50 + r1 * Math.sin(a);
            const x2 = 50 + r2 * Math.cos(a);
            const y2 = 50 + r2 * Math.sin(a);
            return (
              <line
                key={i}
                x1={x1}
                y1={y1}
                x2={x2}
                y2={y2}
                stroke={major ? TOKENS.gold : "rgba(255,255,255,0.28)"}
                strokeWidth={major ? 0.7 : 0.35}
                opacity={spinning ? 1 : 0.65}
              />
            );
          })}
        </svg>

        {/* Spinning wheel SVG */}
        <div
          className={`w-full h-full z-10 ${spinning ? "" : "anim-idle-spin"}`}
          style={{ willChange: spinning ? "transform" : "auto" }}
        >
          <svg
            width="100%"
            height="100%"
            viewBox={`0 0 ${size} ${size}`}
            className="wheel-transition"
            style={{ transform: `rotate(${rotation}deg)` }}
          >
            <defs>
              <radialGradient id="ringGlow" cx="50%" cy="50%" r="50%">
                <stop offset="78%" stopColor={TOKENS.goldSoft} />
                <stop offset="100%" stopColor={TOKENS.copper} />
              </radialGradient>
              <linearGradient id="segHighlight" x1="0%" y1="0%" x2="100%" y2="100%">
                <stop offset="0%" stopColor="rgba(255,255,255,0.12)" />
                <stop offset="100%" stopColor="rgba(0,0,0,0)" />
              </linearGradient>
            </defs>
            {/* Thick gold outer ring */}
            <circle
              cx={cx}
              cy={cy}
              r={r + 9}
              fill="none"
              stroke="url(#ringGlow)"
              strokeWidth="7"
              opacity="0.95"
            />
            <circle
              cx={cx}
              cy={cy}
              r={r + 3}
              fill="#0b0a12"
              stroke="rgba(255,255,255,0.1)"
              strokeWidth="1.5"
            />
            {SEGMENTS.map((seg, i) => {
              const start = i * SEGMENT_ANGLE;
              const end = start + SEGMENT_ANGLE;
              const mid = start + SEGMENT_ANGLE / 2;
              const labelPos = polarToCartesian(cx, cy, r * 0.62, mid);
              const pathD = arcPath(cx, cy, r, start, end);
              return (
                <g key={i}>
                  <path
                    d={pathD}
                    fill={seg.color}
                    stroke="rgba(0,0,0,0.5)"
                    strokeWidth="1.5"
                  />
                  <path d={pathD} fill="url(#segHighlight)" opacity="0.4" />
                  <text
                    x={labelPos.x}
                    y={labelPos.y}
                    textAnchor="middle"
                    dominantBaseline="middle"
                    fontFamily="Space Grotesk"
                    fontWeight="800"
                    fontSize={seg.value >= 200 ? 21 : 18}
                    fill={seg.value >= 200 ? "#1c1420" : "#ffffff"}
                    style={{ pointerEvents: "none" }}
                  >
                    {seg.label}
                  </text>
                </g>
              );
            })}
            {/* Center hub ring */}
            <circle
              cx={cx}
              cy={cy}
              r={r * 0.26}
              fill="#0b0a12"
              stroke={TOKENS.gold}
              strokeWidth="3"
            />
            <circle
              cx={cx}
              cy={cy}
              r={r * 0.26}
              fill="none"
              stroke="rgba(232,184,102,0.25)"
              strokeWidth="8"
            />
          </svg>
        </div>

        {/* Center SPIN button */}
        <button
          ref={wheelBtnRef}
          onClick={handleSpin}
          disabled={spinning}
          aria-label={spinning ? t.spinning : t.spinBtn}
          className={`absolute top-1/2 left-1/2 rounded-full font-display font-bold text-[11px] sm:text-xs tracking-[0.2em] flex items-center justify-center z-20 ${
            pressAnim ? "anim-spin-press" : ""
          }`}
          style={{
            width: "clamp(60px, 19%, 88px)",
            height: "clamp(60px, 19%, 88px)",
            transform: "translate(-50%, -50%)",
            background: spinning
              ? "linear-gradient(145deg, #1a1520, #0b0a12)"
              : "linear-gradient(145deg, #16121c, #0b0a12)",
            border: `2.5px solid ${TOKENS.gold}`,
            color: TOKENS.gold,
            boxShadow: spinning
              ? "0 0 28px rgba(232,184,102,0.55), inset 0 0 16px rgba(232,184,102,0.2)"
              : "0 0 32px rgba(232,184,102,0.5), 0 4px 16px rgba(0,0,0,0.4)",
            cursor: spinning ? "not-allowed" : "pointer",
            transition: "box-shadow 0.3s ease, background 0.3s ease",
          }}
        >
          {spinning ? (
            <span className="animate-spin">
              <Sparkles className="w-5 h-5" />
            </span>
          ) : (
            t.spinBtn
          )}
        </button>
      </div>

      {/* Result / idle hint */}
      <div className="mt-5 sm:mt-6 w-full flex items-center justify-center min-h-[44px]">
        {lastWin !== null ? (
          <div
            key={`${lastWin}-${Date.now()}`}
            className="anim-result-pop flex items-center gap-2.5 rounded-full px-5 py-2.5"
            style={{
              background:
                lastWin > 0
                  ? "linear-gradient(90deg, rgba(232,184,102,0.15), rgba(139,123,255,0.1))"
                  : "rgba(255,255,255,0.04)",
              border: `1px solid ${lastWin > 0 ? "rgba(232,184,102,0.35)" : "rgba(255,255,255,0.08)"}`,
              boxShadow: lastWin > 0 ? "0 0 24px rgba(232,184,102,0.2)" : "none",
            }}
          >
            <Sparkles
              className="w-4 h-4 shrink-0"
              style={{ color: lastWin > 0 ? TOKENS.gold : TOKENS.mist }}
            />
            <span className="font-display text-sm sm:text-[15px]">
              {lastWin > 0 ? (
                <>
                  {t.channelMsg1}
                  <span className="text-gradient-gold font-semibold">
                    +{lastWin} {t.channelMsg2}
                  </span>
                </>
              ) : (
                <span style={{ color: TOKENS.mist }}>{t.channelFail}</span>
              )}
            </span>
          </div>
        ) : !spinning ? (
          <p
            className="font-mono text-[11px] uppercase tracking-[0.18em] anim-spin-hint"
            style={{ color: TOKENS.mist }}
          >
            {t.spinBtn} · {t.wheelOrbits}
          </p>
        ) : (
          <p
            className="font-mono text-[11px] uppercase tracking-[0.18em]"
            style={{ color: TOKENS.gold }}
          >
            {t.spinning}…
          </p>
        )}
      </div>
    </div>
  );
}

/* ---------------------------------------------------------------------------
   ChatInterface
--------------------------------------------------------------------------- */
function ChatInterface({ unlocked, setUnlocked, target, points, userDetails }) {
  const { lang, t } = React.useContext(LanguageContext);
  const userName = userDetails?.name?.split(" ")[0];
  const [messages, setMessages] = useState([]);
  const [input, setInput] = useState("");
  const [loading, setLoading] = useState(false);
  const [justUnlocked, setJustUnlocked] = useState(false);
  const scrollRef = useRef(null);
  const prevUnlocked = useRef(false);

  useEffect(() => {
    if (unlocked && !prevUnlocked.current) {
      setJustUnlocked(true);
      window.setTimeout(() => setJustUnlocked(false), 1600);
      setMessages((m) => [
        ...m,
        {
          role: "ai",
          text: `${t.chatGreeting.replace("{name}", userName || "").replace("{target}", target)}`,
        },
      ]);
    }
    prevUnlocked.current = unlocked;
  }, [unlocked, target, userName, t]);

  useEffect(() => {
    if (loading && scrollRef.current) {
      scrollRef.current.scrollTo({ top: scrollRef.current.scrollHeight, behavior: "smooth" });
    }
  }, [loading, messages]);

  const handleSend = async (e) => {
    e.preventDefault();
    if (!input.trim() || loading || !unlocked) return;
    const userQuestion = input.trim();
    setMessages((m) => [...m, { role: "user", text: userQuestion }]);
    setInput("");
    setLoading(true);
    setUnlocked(false);

    try {
      const res = await fetch("/api/astro/ask", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          name: userDetails?.name || "Seeker",
          dob: userDetails?.dob || "Unknown",
          time: userDetails?.time || "Unknown",
          place: userDetails?.place || "Unknown",
          language: TRANSLATIONS[lang].langName,
          question: userQuestion,
        }),
      });
      if (!res.ok) throw new Error("API Error");
      const data = await res.json();
      setMessages((m) => [...m, { role: "ai", text: data.reading }]);
    } catch (err) {
      setMessages((m) => [...m, { role: "ai", text: t.chatError }]);
    } finally {
      setLoading(false);
    }
  };

  const remaining = Math.max(0, target - (points || 0));

  return (
    <div
      className={`relative card card-blur rounded-3xl overflow-hidden flex flex-col anim-fade-up ${
        justUnlocked ? "anim-chat-unlock" : ""
      }`}
      style={{
        height: "min(540px, 64vh)",
        animationDelay: ".14s",
        border: unlocked
          ? "1px solid rgba(74,222,128,0.25)"
          : "1px solid rgba(139,123,255,0.18)",
        boxShadow: unlocked
          ? "0 12px 48px rgba(0,0,0,0.35), 0 0 50px rgba(74,222,128,0.08)"
          : "0 12px 48px rgba(0,0,0,0.35), 0 0 40px rgba(139,123,255,0.06)",
        transition: "border-color 0.5s ease, box-shadow 0.5s ease",
      }}
    >
      {/* Header */}
      <div
        className="flex items-center gap-3 px-4 sm:px-5 py-3.5 border-b shrink-0"
        style={{
          borderColor: TOKENS.line,
          background: unlocked
            ? "linear-gradient(180deg, rgba(74,222,128,0.06), transparent)"
            : "linear-gradient(180deg, rgba(139,123,255,0.05), transparent)",
        }}
      >
        <div
          className="w-9 h-9 rounded-xl flex items-center justify-center shrink-0"
          style={{
            background: unlocked ? "rgba(74,222,128,0.12)" : "rgba(139,123,255,0.12)",
            border: `1px solid ${unlocked ? "rgba(74,222,128,0.35)" : TOKENS.violet + "55"}`,
            transition: "all 0.4s ease",
          }}
        >
          <Moon className="w-4 h-4" style={{ color: unlocked ? TOKENS.success : TOKENS.violet }} />
        </div>
        <div className="flex-1 min-w-0">
          <h2 className="font-display text-sm font-semibold truncate">{t.chatTitle}</h2>
          <div
            className="flex items-center gap-1.5 font-mono text-[10px] uppercase tracking-[0.14em]"
            style={{ color: TOKENS.mist }}
          >
            <span
              className="w-1.5 h-1.5 rounded-full shrink-0"
              style={{
                background: unlocked ? TOKENS.success : TOKENS.mist,
                boxShadow: unlocked ? `0 0 8px ${TOKENS.success}` : "none",
                animation: unlocked ? "unlockPulse 2s ease-out 2" : "none",
              }}
            />
            {t.chatSubtitle}
          </div>
        </div>
        <Sparkles className="w-4 h-4 shrink-0" style={{ color: TOKENS.gold }} />
      </div>

      {/* Messages */}
      <div ref={scrollRef} className="flex-1 overflow-y-auto scroll-thin px-4 sm:px-5 py-4 space-y-3">
        {messages.map((m, i) => (
          <div
            key={i}
            className={`flex ${m.role === "user" ? "justify-end" : "justify-start"} anim-msg-in`}
            style={{ animationDelay: `${Math.min(i * 0.04, 0.2)}s` }}
          >
            <div
              className={`max-w-[82%] rounded-2xl px-3.5 py-2.5 text-sm leading-relaxed ${
                m.role === "user" ? "rounded-br-sm" : "rounded-bl-sm"
              }`}
              style={
                m.role === "user"
                  ? {
                      background: `linear-gradient(135deg, ${TOKENS.violet}, #a594ff)`,
                      color: "#0b0a12",
                      fontWeight: 500,
                      boxShadow: "0 4px 16px rgba(139,123,255,0.25)",
                    }
                  : {
                      background: "rgba(255,255,255,0.05)",
                      border: `1px solid ${TOKENS.line}`,
                      boxShadow: "0 2px 12px rgba(0,0,0,0.15)",
                    }
              }
            >
              {m.text}
            </div>
          </div>
        ))}
        {loading && (
          <div className="flex justify-start anim-msg-in">
            <div
              className="rounded-2xl rounded-bl-sm px-4 py-3 flex items-center gap-1.5"
              style={{
                background: "rgba(255,255,255,0.05)",
                border: `1px solid ${TOKENS.line}`,
              }}
            >
              {[0, 1, 2].map((d) => (
                <span
                  key={d}
                  className="w-1.5 h-1.5 rounded-full"
                  style={{
                    background: TOKENS.violet,
                    animation: "dotPulse 1.2s ease-in-out infinite",
                    animationDelay: `${d * 0.15}s`,
                  }}
                />
              ))}
            </div>
          </div>
        )}
      </div>

      {/* Footer */}
      {!unlocked && messages.length > 0 ? (
        <div
          className="p-4 border-t shrink-0 flex flex-col items-center justify-center text-center"
          style={{
            borderColor: TOKENS.line,
            background: "linear-gradient(180deg, transparent, rgba(0,0,0,0.35))",
          }}
        >
          <div className="flex items-center gap-2 mb-1">
            <Lock className="w-3.5 h-3.5" style={{ color: TOKENS.gold }} />
            <span className="text-sm font-semibold text-white">{t.chatLocked}</span>
          </div>
          <span className="text-xs" style={{ color: TOKENS.mist }}>
            {t.lockMsg2.replace("{remaining}", remaining)}
          </span>
        </div>
      ) : (
        <form
          onSubmit={handleSend}
          className="p-3.5 sm:p-4 border-t shrink-0"
          style={{ borderColor: TOKENS.line }}
        >
          <div
            className="input-glow flex items-center gap-2 rounded-xl px-3 py-2.5 bg-black/30 border border-white/10"
            style={
              unlocked
                ? { borderColor: "rgba(74,222,128,0.25)", boxShadow: "0 0 16px rgba(74,222,128,0.08)" }
                : {}
            }
          >
            <input
              value={input}
              onChange={(e) => setInput(e.target.value)}
              disabled={!unlocked}
              placeholder={unlocked ? t.chatInput : t.chatLocked}
              className="flex-1 bg-transparent text-sm placeholder-white/25 disabled:cursor-not-allowed min-w-0"
              aria-label={t.chatInput}
            />
            <button
              type="submit"
              disabled={!unlocked || !input.trim() || loading}
              aria-label={t.chatSend}
              className="w-9 h-9 rounded-lg flex items-center justify-center shrink-0 disabled:opacity-30 transition-transform active:scale-90 hover:brightness-110"
              style={{
                background: unlocked
                  ? `linear-gradient(135deg, ${TOKENS.gold}, ${TOKENS.copper})`
                  : TOKENS.gold,
                color: "#0b0a12",
                boxShadow: unlocked ? "0 0 14px rgba(232,184,102,0.35)" : "none",
              }}
            >
              <ArrowUp className="w-4 h-4" />
            </button>
          </div>
        </form>
      )}

      {/* Locked overlay */}
      {!unlocked && messages.length === 0 && (
        <div
          className="absolute inset-0 flex flex-col items-center justify-center text-center px-8 sm:px-10"
          style={{
            backdropFilter: "blur(16px)",
            WebkitBackdropFilter: "blur(16px)",
            background: "rgba(7,7,11,0.62)",
          }}
        >
          <div
            className="w-16 h-16 rounded-2xl flex items-center justify-center mb-5 anim-float-orb"
            style={{
              border: `1px solid ${TOKENS.gold}66`,
              background: "rgba(232,184,102,0.08)",
              boxShadow: "0 0 30px rgba(232,184,102,0.12)",
              animationDuration: "3.5s",
            }}
          >
            <Lock className="w-6 h-6" style={{ color: TOKENS.gold }} />
          </div>
          <h3 className="font-display text-lg sm:text-xl font-semibold mb-2">{t.chatLocked}</h3>
          <p className="text-sm max-w-[260px] leading-relaxed" style={{ color: TOKENS.mist }}>
            {t.lockMsg2.replace("{remaining}", remaining)}
          </p>
          {/* Progress mini bar */}
          <div className="mt-5 w-40 h-1 rounded-full bg-white/10 overflow-hidden">
            <div
              className="h-full rounded-full transition-all duration-700"
              style={{
                width: `${Math.min(100, ((points || 0) / target) * 100)}%`,
                background: `linear-gradient(90deg, ${TOKENS.copper}, ${TOKENS.gold})`,
              }}
            />
          </div>
        </div>
      )}
    </div>
  );
}

/* ---------------------------------------------------------------------------
   App
--------------------------------------------------------------------------- */
function App() {
  const [lang, setLang] = useState("en");
  const t = TRANSLATIONS[lang];
  const [userDetails, setUserDetails] = useState(null);
  const [points, setPoints] = useState(0);
  const [target, setTarget] = useState(100);
  const [spinsUsed, setSpinsUsed] = useState(0);
  const [unlocked, setUnlocked] = useState(false);

  const handleWin = (won) => {
    setSpinsUsed((s) => s + 1);
    const nextPoints = points + won;
    setPoints(nextPoints);
    if (nextPoints >= target && !unlocked) {
      setUnlocked(true);
      setTarget((t) => t + 100);
    }
  };

  return (
    <LanguageContext.Provider value={{ lang, setLang, t }}>
      <div className="astrowheel-root min-h-screen w-full safe-bottom anim-page-enter">
        <GlobalStyles />
        <SpaceBackground />

        {!userDetails && <UserDetailsModal onSubmit={setUserDetails} />}

        <div
          className={
            userDetails
              ? "transition-all duration-500"
              : "pointer-events-none blur-[4px] select-none opacity-70 transition-all duration-500"
          }
        >
          <Header points={points} target={target} />
          <Hero />

          <main className="max-w-6xl mx-auto px-4 sm:px-6 lg:px-8 pb-12 sm:pb-16">
            <div className="grid grid-cols-1 lg:grid-cols-2 gap-4 sm:gap-6 lg:gap-8 items-start">
              <FortuneWheel onWin={handleWin} spinsUsed={spinsUsed} />
              <ChatInterface
                unlocked={unlocked}
                setUnlocked={setUnlocked}
                target={target}
                points={points}
                userDetails={userDetails}
              />
            </div>
          </main>
        </div>
      </div>
    </LanguageContext.Provider>
  );
}

const root = createRoot(document.getElementById("root"));
root.render(<App />);
  </script>
</body>
</html>
